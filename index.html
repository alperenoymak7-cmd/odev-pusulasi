ım')}</button><button data-nav="history">▤ ${tx('Geçmiş ödevler')}</button><button data-nav="setup">♧ ${tx('Sınıf ve öğrenciler')}</button><button data-nav="links">↗ ${tx('Öğrenci bağlantıları')}</button><button id="logoutMobile">${tx('Çıkış yap')}</button></nav></div>`}

function taskCard(a){let rr=responses.filter(r=>r.assignment_id===a.id),counts={done:0,no:0,partial:0,confused:0,wait:0};rr.forEach(r=>counts[r.status]++);counts.wait=Math.max(0,students.length-rr.length);return `<article class="assignment"><div class="assignmenthead"><div><h3>${esc(a.title)}</h3><p>${esc(a.description||'')}</p><div class="meta">${tx('Hafta:')} ${fmt(a.week_start)}${a.due_date?' · '+tx('Son tarih:')+' '+fmt(a.due_date):''}</div></div>${a.is_open?`<button class="btn small" data-close-assignment="${a.id}">${tx('Ödevi kapat')}</button>`:`<span class="badge wait">${tx('Kapalı')}</span>`}</div><div class="countrow">${[['done','Yaptı'],['no','Yapmadı'],['partial','Kısmen'],['confused','Yardım istiyor'],['wait','Yanıt yok']].map(([k,t])=>`<span class="badge ${k}">${tx(t)}: ${counts[k]}</span>`).join('')}</div>${students.map(s=>{let r=rr.find(x=>x.student_id===s.id);return `<div class="answerrow"><div><b>${esc(s.display_name)}</b>${r?.word_one||r?.word_two?`<small>${tx('Yeni kelimeler:')} ${esc([r.word_one,r.word_two].filter(Boolean).join(' · '))}</small>`:''}${r?.reflection?`<small>${tx('Konu yorumu:')} ${esc(r.reflection)}</small>`:''}${r?.comment?`<small>${tx('Anlamadığı yer:')} ${esc(r.comment)}</small>`:''}${r?`<small>${tx('Güncellendi:')} ${new Date(r.updated_at).toLocaleString(language==='en'?'en-US':'tr-TR')}</small>`:''}</div><div><span class="badge ${r?.status||'wait'}">${r?tx(statusName[r.status]):tx('Henüz yanıt vermedi')}</span><select class="teacher-status" data-teacher-status data-assignment="${a.id}" data-student="${s.id}" aria-label="${tx('Öğretmen durum işaretle')}"><option value="">${tx('Öğretmen durum işaretle')}</option>${[['done','Yaptı'],['no','Yapmadı'],['partial','Kısmen'],['confused','Yardım istiyor']].map(([k,t])=>`<option value="${k}" ${r?.status===k?'selected':''}>${tx(t)}</option>`).join('')}</select></div></div>`}).join('')}</article>`}
function historyView(){const closed=assignments.filter(a=>!a.is_open);return `<div class="panel"><div class="panelhead"><div><h2>${tx('Kapanmış ödevler')}</h2><div class="muted">${tx('Yanıtlar kayıtlı kalır ve daha sonra görüntülenebilir.')}</div></div></div>${closed.length?closed.map(taskCard).join(''):`<div class="empty">${tx('Henüz kapanmış ödev bulunmuyor.')}</div>`}</div>`}
function usernameSuggestion(name){
  const base=Array.from(String(name||'ogrenci').toLowerCase().replace(/[ıİ]/g,'i').normalize('NFKD')).filter(ch=>{const n=ch.charCodeAt(0);return n<768||n>879}).join('').replace(/[^a-z0-9]/g,'').slice(0,22)||'ogrenci';
  return (base+String(Math.floor(1000+Math.random()*9000))).slice(0,32)
}

  const reveal=studentCredentialReveal?'<div class="panel"><div class="panelhead"><div><h2>Öğrenci giriş bilgileri</h2><div class="muted">'+esc(studentCredentialReveal.name)+' için şifre yalnızca bu ekranda gösteriliyor.</div></div></div><div class="fields"><div class="field"><label>Kullanıcı adı</label><input readonly value="'+esc(studentCredentialReveal.username)+'"></div><div class="field"><label>Şifre</label><input readonly value="'+esc(studentCredentialReveal.password)+'"></div><div class="field full"><button class="btn primary" id="copyStudentCredentials">Bilgileri kopyala</button> <button class="btn" id="hideStudentCredentials">Gizle</button></div></div><div class="muted">Bilgileri öğrenciye ulaştır. Şifre veritabanında açık olarak tutulmaz; unutulursa yenisini oluşturabilirsin.</div></div>':'';

}
function makeStudentPassword(name){
  let first=String(name||'ogrenci').trim().split(/\s+/)[0].toLowerCase().replace(/[ıİ]/g,'i').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')||'ogrenci';
  let password=first+'2026';while(password.length<8)password+='1';return password.slice(0,72)
}
async function openCredentialEditor(studentId){
  const s=students.find(x=>x.id===studentId);
  if(!s)return;
  const username=s.username||usernameSuggestion(s.display_name),password=makeStudentPassword(s.display_name);
  const buttons=$$('[data-credentials]');
  buttons.forEach(b=>b.disabled=true);
  try{
    const{data,error}=await sb.rpc('set_student_credentials',{p_student_id:studentId,p_username:username,p_password:password});
    if(error)throw error;
    s.username=data||username;
    studentCredentialReveal={name:s.display_name,username:s.username,password};
    renderTeacher('setup');
    toast('Giriş bilgileri oluşturuldu. Öğrenciye paylaşabilirsin.');
  }catch(e){
    toast('Giriş bilgisi oluşturulamadı: '+errText(e));
    buttons.forEach(b=>b.disabled=false);
  }
}

function passwordRecoveryView(){app.innerHTML=`<div class="center"><div style="display:flex;justify-content:flex-end">${langButton()}</div><div class="panel"><h1>${tx('Yeni ?ifre belirle')}</h1><p class="muted">${tx('??retmen hesab?n i?in en az 8 karakterli yeni bir ?ifre olu?tur.')}</p><div id="recoveryMsg"></div><div class="fields"><div class="field full"><label for="newTeacherPassword">${tx('Yeni ?ifre')}</label><input id="newTeacherPassword" type="password" minlength="8" autocomplete="new-password"></div><div class="field full"><button class="btn primary" id="saveTeacherPassword">${tx('?ifreyi kaydet')}</button></div></div></div></div>`;bindLanguageButton(()=>passwordRecoveryView());$('#saveTeacherPassword').onclick=async()=>{const password=$('#newTeacherPassword').value;if(password.length<8){$('#recoveryMsg').innerHTML=notice(tx('?ifre en az 8 karakter olmal?.'),'warn');return}const button=$('#saveTeacherPassword');button.disabled=true;try{const{error}=await sb.auth.updateUser({password});if(error)throw error;$('#recoveryMsg').innerHTML=notice(tx('?ifren g?ncellendi. Hesab?n a??l?yor.'));setTimeout(startTeacher,700)}catch(e){$('#recoveryMsg').innerHTML=notice(esc(errText(e)),'error');button.disabled=false}}}
function showConfigError(){app.innerHTML=`<div class="center"><div class="panel"><div class="brand"><div class="logo" aria-hidden="true"><img src="./english-time-mark.svg" alt=""></div><div><b>English Time Ödev Takip Sistemi</b><small>Başlatma sırasında bağlantı kurulamadı</small></div></div><div class="message error">Supabase bağlantı bilgileri ayarlı değil veya Supabase'e ulaşılamadı. config.js içindeki Project URL ve publishable key değerlerini kontrol et.</div><button class="btn" onclick="location.reload()">Yeniden yükle</button></div></div>`}
async function studentPage(token){activeStudentToken=token;document.body.className='';app.innerHTML=`<main class="student-shell"><div class="student-brand" style="justify-content:space-between"><div style="display:flex;align-items:center;gap:9px"><div class="logo" aria-hidden="true"><img src="./english-time-mark.svg" alt=""></div><b>${tx('English Time Ödev Takip Sistemi')}</b></div><div class="formrow">${langButton()}<button class="btn small" id="studentLogout">${tx('Çıkış yap')}</button></div></div><div class="studenthero"><h1>${tx('Ödev durumun')}</h1><p>${tx('Durumunu seç, iki yeni kelimeyi ve ödevle ilgili yorumunu yazıp kaydet.')}</p></div><div id="studentContent" class="panel"><div class="muted">${tx('Ödevlerin yükleniyor…')}</div></div></main>`;const host=$('#studentContent');bindLanguageButton(()=>studentPage(activeStudentToken));$('#studentLogout').onclick=()=>studentLogout(token);try{const{data,error}=await sb.rpc('get_student_portal',{p_token:token});if(error)throw error;const payload=data,homeworks=payload.assignments||[];host.innerHTML=`<div style="font-size:12px;font-weight:750;margin-bottom:12px">${esc(payload.student.name)} · ${esc(payload.classroom.grade)}-${esc(payload.classroom.branch)}</div>${homeworks.length?homeworks.map(a=>studentTask(a)).join(''):`<div class="empty">${tx('Şu anda açık ödevin yok.')}</div>`}`;$$('[data-pick]').forEach(b=>b.onclick=()=>{const card=b.closest('[data-task]');card.dataset.selected=b.dataset.status;card.querySelectorAll('[data-pick]').forEach(x=>x.className='choice '+(x===b?'sel '+x.dataset.status:''));card.querySelector('[data-submit]').disabled=false});$$('[data-submit]').forEach(b=>b.onclick=()=>{const card=b.closest('[data-task]');submitAnswer(token,card.dataset.task,card.dataset.selected,card.querySelector('[data-word-one]').value,card.querySelector('[data-word-two]').value,card.querySelector('[data-reflection]').value,card.querySelector('[data-confusion]').value,b)})}catch(e){host.innerHTML=notice(`${tx('Bu öğrenci bağlantısı geçersiz veya yenilenmiş olabilir. Öğretmeninden güncel bağlantıyı iste.')}<br><br>${esc(errText(e))}`,'error')}}
function studentTask(a){const status=a.response_status,opts=[['done','✓ Yaptım'],['no','× Yapmadım'],['partial','◐ Kısmen yaptım'],['confused','? Yardım istiyorum']];return `<article class="task" data-task="${a.id}" data-selected="${status||''}"><h2>${esc(a.title)}</h2><p>${esc(a.description||'')}${a.due_date?' · '+tx('Son tarih:')+' '+fmt(a.due_date):''}</p><div class="choices">${opts.map(([k,t])=>`<button type="button" class="choice ${status===k?'sel '+k:''}" data-pick="${a.id}" data-status="${k}">${tx(t)}</button>`).join('')}</div><div class="fields" style="margin-top:12px"><div class="field"><label>${tx('Yeni kelime 1 *')}</label><input data-word-one maxlength="80" value="${esc(a.word_one||'')}" placeholder="${tx('Öğrendiğin kelime')}"></div><div class="field"><label>${tx('Yeni kelime 2 *')}</label><input data-word-two maxlength="80" value="${esc(a.word_two||'')}" placeholder="${tx('Öğrendiğin başka bir kelime')}"></div><div class="field full"><label>${tx('Ödev/konu hakkında yorumun *')}</label><textarea class="comment" data-reflection maxlength="1000" placeholder="${tx('Bu ödevde ne öğrendin? Konu hakkında ne düşünüyorsun?')}">${esc(a.reflection||'')}</textarea></div><div class="field full"><label>${tx('Anlamadığın yer (isteğe bağlı)')}</label><textarea class="comment" data-confusion maxlength="1000" placeholder="${tx('Yardım istiyorsan hangi bölümde zorlandığını yaz')}">${esc(a.comment||'')}</textarea></div><div class="field full"><button type="button" class="btn primary" data-submit="${a.id}" ${status?'':'disabled'}>${tx('Yanıtı kaydet')}</button></div></div>${status?`<div class="muted" style="margin-top:8px">${tx('Yanıtını güncellemek istersen alanları düzenleyip yeniden kaydedebilirsin.')}</div>`:`<div class="muted" style="margin-top:8px">${tx('Önce yukarıdan ödev durumunu seç.')}</div>`}</article>`}async function init(){document.documentElement.lang=language;document.title=language==='en'?'English Time | Homework Tracker':'English Time | Ödev Takip Sistemi';if(!configured){configView();return}try{sb=createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const token=new URLSearchParams(location.search).get('o');if(token){await studentPage(token);return}const studentToken=sessionStorage.getItem('odevPusulasiStudentSession');if(studentToken){await studentPage(studentToken);return}const{data:{session}}=await sb.auth.getSession();if(location.hash.includes('type=recovery'))passwordRecoveryView();else if(session){const{data:isAdmin}=await sb.rpc('has_admin_access');if(isAdmin===true){adminMode=true;await startAdmin()}else await startTeacher()}else authView('teacher');sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'){passwordRecoveryView();return}if(event==='SIGNED_IN'&&session){if(location.hash.includes('type=recovery')){passwordRecoveryView();return}user=session.user;setTimeout(async()=>{if(adminMode||adminLoginPending)return;const{data:isAdmin}=await sb.rpc('has_admin_access');if(isAdmin===true){adminMode=true;startAdmin()}else startTeacher()},0)}if(event==='SIGNED_OUT'){user=null;adminMode=false;window.adminData=null;authView('teacher')}})}catch(e){showConfigError()}}
init();
</script></body></html>
