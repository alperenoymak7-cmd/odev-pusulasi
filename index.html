function homeView(){const open=assignments.filter(a=>a.is_open),done=responses.filter(r=>r.status==='done').length,help=responses.filter(r=>r.status==='confused').length,waiting=Math.max(0,open.reduce((n,a)=>n+students.length,0)-responses.filter(r=>open.some(a=>a.id===r.assignment_id)).length);return `<div class="gridstats"><div class="stat"><small>Öğrenciler</small><b>${students.length}</b></div><div class="stat"><small>Açık ödevler</small><b>${open.length}</b></div><div class="stat"><small>Yanıt geldi</small><b>${responses.length}</b></div><div class="stat"><small>Yardım istiyor</small><b>${help}</b></div></div><div class="panel"><div class="panelhead"><div><h2>Bu haftanın ödevleri</h2><div class="muted">Yanıt vermeyen öğrenciler “Henüz yanıt vermedi” olarak görünür.</div></div><button id="refresh" class="btn small">↻ Yenile</button></div>${open.length?open.map(a=>taskCard(a)).join(''):'<div class="empty">Henüz açık ödev yok. Ödev eklemek için “Yeni haftalık ödev” alanını kullan.</div>'}</div><div class="panel"><div class="panelhead"><div><h2>Yeni haftalık ödev</h2><div class="muted">Öğrenciye durum bağlantısı otomatik olarak açılır.</div></div></div><div class="fields"><div class="field full"><label for="aTitle">Ödev adı</label><input id="aTitle" placeholder="Örn. Matematik çalışma kitabı, sayfa 32"></div><div class="field full"><label for="aDesc">Kısa açıklama (isteğe bağlı)</label><textarea id="aDesc" placeholder="Öğrenciye ödevle ilgili kısa not"></textarea></div><div class="field"><label for="aWeek">Hafta başlangıcı</label><input id="aWeek" type="date" value="${weekToday()}"></div><div class="field"><label for="aDue">Son tarih (isteğe bağlı)</label><input id="aDue" type="date"></div><div class="field full"><button class="btn primary" id="addAssignment">Ödevi yayımla</button></div></div></div>${notice(`Toplam tamamlayan: <b>${done}</b> · Henüz yanıt vermeyen: <b>${waiting}</b>. Öğretmen hesabın yalnızca kendi sınıfına erişir.`)}`}
function taskCard(a){let rr=responses.filter(r=>r.assignment_id===a.id),counts={done:0,no:0,partial:0,confused:0,wait:0};rr.forEach(r=>counts[r.status]++);counts.wait=Math.max(0,students.length-rr.length);return `<article class="assignment"><div class="assignmenthead"><div><h3>${esc(a.title)}</h3><p>${esc(a.description||'')}</p><div class="meta">Hafta: ${fmt(a.week_start)}${a.due_date?' · Son tarih: '+fmt(a.due_date):''}</div></div>${a.is_open?`<button class="btn small" data-close-assignment="${a.id}">Ödevi kapat</button>`:'<span class="badge wait">Kapalı</span>'}</div><div class="countrow">${[['done','Yaptı'],['no','Yapmadı'],['partial','Kısmen'],['confused','Yardım istiyor'],['wait','Yanıt yok']].map(([k,t])=>`<span class="badge ${k}">${tx(t)}: ${counts[k]}</span>`).join('')}</div>${students.map(s=>{let r=rr.find(x=>x.student_id===s.id);return `<div class="answerrow"><div><b>${esc(s.display_name)}</b>${r?.word_one||r?.word_two?`<small>Yeni kelimeler: ${esc([r.word_one,r.word_two].filter(Boolean).join(' · '))}</small>`:''}${r?.reflection?`<small>Konu yorumu: ${esc(r.reflection)}</small>`:''}${r?.comment?`<small>Anlamadığı yer: ${esc(r.comment)}</small>`:''}${r?`<small>Güncellendi: ${new Date(r.updated_at).toLocaleString(language==='en'?'en-US':'tr-TR')}</small>`:''}</div><div><span class="badge ${r?.status||'wait'}">${r?tx(statusName[r.status]):tx('Henüz yanıt vermedi')}</span><select class="teacher-status" data-teacher-status data-assignment="${a.id}" data-student="${s.id}" aria-label="${esc(s.display_name)} ödev durumu"><option value="">Set status (teacher)</option>${[['done','Yaptı'],['no','Yapmadı'],['partial','Kısmen'],['confused','Yardım istiyor']].map(([k,t])=>`<option value="${k}" ${r?.status===k?'selected':''}>${t}</option>`).join('')}</select></div></div>`}).join('')}</article>`}
function historyView(){const closed=assignments.filter(a=>!a.is_open);return `<div class="panel"><div class="panelhead"><div><h2>Kapanmış ödevler</h2><div class="muted">Yanıtlar kayıtlı kalır ve daha sonra görüntülenebilir.</div></div></div>${closed.length?closed.map(taskCard).join(''):'<div class="empty">Henüz kapanmış ödev bulunmuyor.</div>'}</div>`}
function usernameSuggestion(name){
  const base=Array.from(String(name||'ogrenci').toLowerCase().replace(/[ıİ]/g,'i').normalize('NFKD')).filter(ch=>{const n=ch.charCodeAt(0);return n<768||n>879}).join('').replace(/[^a-z0-9]/g,'').slice(0,22)||'ogrenci';
  return (base+String(Math.floor(1000+Math.random()*9000))).slice(0,32)
}
function setupView(){
  const reveal=studentCredentialReveal?'<div class="panel"><div class="panelhead"><div><h2>Öğrenci giriş bilgileri</h2><div class="muted">'+esc(studentCredentialReveal.name)+' için şifre yalnızca bu ekranda gösteriliyor.</div></div></div><div class="fields"><div class="field"><label>Kullanıcı adı</label><input readonly value="'+esc(studentCredentialReveal.username)+'"></div><div class="field"><label>Şifre</label><input readonly value="'+esc(studentCredentialReveal.password)+'"></div><div class="field full"><button class="btn primary" id="copyStudentCredentials">Bilgileri kopyala</button> <button class="btn" id="hideStudentCredentials">Gizle</button></div></div><div class="muted">Bilgileri öğrenciye ulaştır. Şifre veritabanında açık olarak tutulmaz; unutulursa yenisini oluşturabilirsin.</div></div>':'';
  return reveal+'<div class="panel"><div class="panelhead"><div><h2>Sınıf bilgileri</h2><div class="muted">Bu öğretmen hesabının sınıfı: '+esc(currentClass.grade)+'-'+esc(currentClass.branch)+'</div></div></div><div class="fields"><div class="field"><label for="editGrade">Sınıf düzeyi</label><input id="editGrade" value="'+esc(currentClass.grade)+'"></div><div class="field"><label for="editBranch">Şube</label><input id="editBranch" value="'+esc(currentClass.branch)+'"></div><div class="field full"><button class="btn primary" id="saveClass">Sınıf bilgilerini güncelle</button></div></div></div><div class="panel"><div class="panelhead"><div><h2>Öğrenci listesi</h2><div class="muted">Bir satıra bir öğrenci adı yaz. Öğrenci giriş bilgilerini buradan oluşturup paylaşabilirsin.</div></div><span class="badge wait">'+students.length+' öğrenci</span></div><div class="fields"><div class="field full"><label for="bulkNames">Öğrenci adları</label><textarea id="bulkNames" placeholder="Örn.&#10;Elif Demir&#10;Mert Kaya&#10;Zeynep Şahin"></textarea></div><div class="field full"><button class="btn primary" id="addStudents">Öğrencileri ekle</button></div></div><div style="margin-top:12px">'+(students.map(s=>'<div class="studentrow"><div><div class="studentname">'+esc(s.display_name)+'</div><div class="muted">'+(s.username?'Kullanıcı adı: '+esc(s.username):'Henüz öğrenci girişi oluşturulmadı')+'</div></div><div class="formrow"><button class="btn soft small" data-credentials="'+s.id+'">'+(s.username?'Giriş bilgilerini değiştir':'Giriş bilgisi oluştur')+'</button><button class="btn danger small" data-delete-student="'+s.id+'">Listeden kaldır</button></div></div>').join('')||'<div class="empty">Henüz öğrenci eklenmedi.</div>')+'<div id="credentialEditor"></div></div></div>'
}
function makeStudentPassword(name){
  let first=String(name||'ogrenci').trim().split(/\s+/)[0].toLowerCase().replace(/[ıİ]/g,'i').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')||'ogrenci';
  let password=first+'2026';while(password.length<8)password+='1';return password.slice(0,72)
}
async function openCredentialEditor(studentId){
  const s=students.find(x=>x.id===studentId);
  if(!s)return;
  const username=s.username||usernameSuggestion(s.display_name),password=makeStudentPassword(s.display_name);
  const buttons=$$('[data-credentials]');
  buttons.forEach(b=>b.disabled=true);
  try{
    const{data,error}=await sb.rpc('set_student_credentials',{p_student_id:studentId,p_username:username,p_password:password});
    if(error)throw error;
    s.username=data||username;
    studentCredentialReveal={name:s.display_name,username:s.username,password};
    renderTeacher('setup');
    toast('Giriş bilgileri oluşturuldu. Öğrenciye paylaşabilirsin.');
  }catch(e){
    toast('Giriş bilgisi oluşturulamadı: '+errText(e));
    buttons.forEach(b=>b.disabled=false);
  }
}
function linksView(){return `<div class="panel"><div class="panelhead"><div><h2>Öğrenci bağlantıları</h2><div class="muted">Her bağlantı tek bir öğrenciye özeldir. Bağlantıyı kopyalayıp öğrenciye gönder.</div></div></div>${notice('Bağlantıyı yenilersen eski bağlantı çalışmayı durdurur. Kişiye özel linki yalnızca ilgili öğrenciyle paylaş.','warn')}${students.map(s=>{let href=linkCache[s.id]||'';return `<div class="studentrow"><div style="flex:1;min-width:0"><div class="studentname">${esc(s.display_name)}</div>${href?`<div class="linkout"><input readonly value="${esc(href)}" id="link-${s.id}"><button class="btn soft small" data-copy-link="${s.id}">Kopyala</button></div>`:'<div class="muted">Henüz bağlantı oluşturulmadı.</div>'}</div><button class="btn small" data-new-link="${s.id}">${href?'Yeni bağlantı':'Bağlantı oluştur'}</button></div>`}).join('')||'<div class="empty">Önce sınıfına öğrenci ekle.</div>'}</div>`}
function authView(role='teacher'){

  app.innerHTML=`<div class="center"><div style="display:flex;justify-content:flex-end">${langButton()}</div><div class="brand"><div class="logo">✓</div><div><b>English Time Ödev Takip Sistemi</b><small>Haftalık ödev takibi</small></div></div><div class="authswitch"><button class="btn primary" id="teacherRoleTab">Öğretmen girişi</button><button class="btn" id="studentRoleTab">Öğrenci girişi</button><button class="btn" id="adminRoleTab">Yönetici girişi</button></div><div class="panel" id="teacherLoginPanel"><h1>Öğretmen girişi</h1><p class="muted">Sınıfını kur, haftalık ödev ekle ve öğrenci yanıtlarını izle.</p><div id="authMsg"></div><div class="authswitch"><button class="btn primary" id="loginTab">Giriş yap</button><button class="btn" id="signupTab">Hesap oluştur</button></div><div class="fields"><div id="nameField" class="field full hidden"><label for="fullName">Adın</label><input id="fullName" autocomplete="name" placeholder="Öğretmen adı"></div><div class="field full"><label for="email">E-posta</label><input id="email" type="email" autocomplete="email"></div><div class="field full"><label for="password">Şifre</label><input id="password" type="password" autocomplete="current-password" minlength="8"></div><div class="field full"><button class="btn primary" id="authSubmit">Giriş yap</button><button class="btn" id="forgotPassword" type="button" style="margin-left:8px">Şifremi unuttum</button></div></div><div class="muted">Öğretmen hesapları birbirinden ayrıdır. Öğrenci listeleri ve yanıtlar diğer öğretmenlere gösterilmez.</div></div><div class="panel hidden" id="studentLoginPanel"><h1>Öğrenci girişi</h1><p class="muted">Öğretmeninin verdiği kullanıcı adı ve şifreyle giriş yap.</p><div id="studentLoginMessage"></div><div class="fields"><div class="field full"><label for="studentLoginUsername">Kullanıcı adı</label><input id="studentLoginUsername" autocomplete="username" autocapitalize="none"></div><div class="field full"><label for="studentLoginPassword">Şifre</label><input id="studentLoginPassword" type="password" autocomplete="current-password"></div><div class="field full"><button class="btn primary" id="studentLoginSubmit">Öğrenci olarak giriş yap</button></div></div><div class="muted">Öğrenci girişi yalnızca kendi sınıfını, açık ödevlerini ve yanıt alanını gösterir.</div></div><div class="panel hidden" id="adminLoginPanel"><h1>Yönetici girişi</h1><p class="muted">Tüm öğretmenlerin sınıflarını ve ödev yanıtlarını görüntüle.</p><div id="adminLoginMessage"></div><div class="fields"><div class="field full"><label for="adminEmail">E-posta</label><input id="adminEmail" type="email" autocomplete="username"></div><div class="field full"><label for="adminPassword">Şifre</label><input id="adminPassword" type="password" autocomplete="current-password"></div><div class="field full"><label for="adminCode">Yönetici kodu</label><input id="adminCode" type="password" autocomplete="off"></div><div class="field full"><button class="btn primary" id="adminLoginSubmit">Yönetici olarak giriş yap</button></div></div><div class="muted">E-posta ve şifre, yönetici olarak tanımlanmış öğretmen hesabına ait olmalı.</div></div></div>';
  let mode=activeAuthMode;
  bindLanguageButton(()=>authView(activeAuthRole));
  const setRole=r=>{const isStudent=r==='student',isAdmin=r==='admin';$('#teacherLoginPanel').classList.toggle('hidden',isStudent||isAdmin);$('#studentLoginPanel').classList.toggle('hidden',!isStudent);$('#adminLoginPanel').classList.toggle('hidden',!isAdmin);$('#teacherRoleTab').className=!isStudent&&!isAdmin?'btn primary':'btn';$('#studentRoleTab').className=isStudent?'btn primary':'btn';$('#adminRoleTab').className=isAdmin?'btn primary':'btn';if(isStudent)$('#studentLoginUsername').focus();if(isAdmin)$('#adminEmail').focus()};
  const setMode=m=>{mode=m;activeAuthMode=m;$('#loginTab').className=m==='login'?'btn primary':'btn';$('#signupTab').className=m==='signup'?'btn primary':'btn';$('#nameField').classList.toggle('hidden',m!=='signup');$('#authSubmit').textContent=m==='signup'?'Hesap oluştur':'Giriş yap';$('#password').autocomplete=m==='signup'?'new-password':'current-password';$('#authMsg').innerHTML=''};
  $('#teacherRoleTab').onclick=()=>setRole('teacher');$('#studentRoleTab').onclick=()=>setRole('student');$('#adminRoleTab').onclick=()=>setRole('admin');setRole(role);
  $('#loginTab').onclick=()=>setMode('login');$('#signupTab').onclick=()=>setMode('signup');
  $('#forgotPassword').onclick=async()=>{const email=$('#email').value.trim();if(!email){$('#authMsg').innerHTML=notice('Önce öğretmen hesabındaki e-posta adresini yaz.','warn');$('#email').focus();return}const button=$('#forgotPassword');button.disabled=true;try{const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)throw error;$('#authMsg').innerHTML=notice('E-posta adresin kayıtlıysa şifre yenileme bağlantısı gönderildi. Gelen kutunu ve gereksiz posta klasörünü kontrol et.')}catch(e){$('#authMsg').innerHTML=notice(esc(errText(e)),'error')}finally{button.disabled=false}};
  $('#email').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#password').focus()}};$('#password').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#authSubmit').click()}};$('#studentLoginUsername').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#studentLoginPassword').focus()}};$('#studentLoginPassword').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#studentLoginSubmit').click()}};$('#adminEmail').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#adminPassword').focus()}};$('#adminPassword').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#adminCode').focus()}};$('#adminCode').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#adminLoginSubmit').click()}};$('#authSubmit').onclick=async()=>{const email=$('#email').value.trim(),password=$('#password').value,name=$('#fullName')?.value.trim();if(!email||password.length<8){$('#authMsg').innerHTML=notice('E-posta gir ve en az 8 karakterli şifre seç.','warn');return}$('#authSubmit').disabled=true;try{if(mode==='signup'){const{data,error}=await sb.auth.signUp({email,password,options:{data:{display_name:name||'Öğretmen'}}});if(error)throw error;if(!data.session){$('#authMsg').innerHTML=notice('Hesap oluşturuldu. E-postana gelen doğrulama bağlantısını aç, sonra giriş yap.');return}}else{const{error}=await sb.auth.signInWithPassword({email,password});if(error)throw error}return}catch(e){$('#authMsg').innerHTML=notice(esc(errText(e)),'error')}finally{$('#authSubmit').disabled=false}};

function configView(){app.innerHTML=`<div class="center"><div class="panel"><div class="brand"><div class="logo">✓</div><div><b>English Time Ödev Takip Sistemi kurulumu</b><small>Bir defalık bağlantı ayarı</small></div></div><p>Bu taslak veri güvenliği için Supabase hesabına bağlanacak şekilde hazırlandı. Önce Supabase projesi oluştur, <b>supabase-schema.sql</b> dosyasını SQL Editor'de çalıştır ve Project URL ile publishable key değerlerini <b>config.js</b> dosyasına gir.</p><p class="muted">Tarayıcıda sadece publishable/anon key kullanılır. Secret veya service_role anahtarını buraya koyma.</p><div class="message warn">Kurulum tamamlanmadan öğretmen hesabı, gerçek öğrenci bağlantısı ve cihazlar arası yanıt eşitlemesi kullanılamaz.</div></div></div>`}
async function loadTeacherData(){const p=await sb.from('teacher_profiles').select('display_name').eq('user_id',user.id).maybeSingle();if(p.error)throw p.error;if(p.data?.display_name&&p.data.display_name!==user.user_metadata?.display_name){await sb.auth.updateUser({data:{display_name:p.data.display_name}})}const c=await sb.from('classrooms').select('*').order('created_at');if(c.error)throw c.error;classes=c.data||[];if(!classes.length){currentClass=null;showNewClassForm();return}currentClass=classes[0];await refreshData();renderTeacher('home')}
function showNewClassForm(){app.innerHTML=noClass();$('#createClass').onclick=createClass;$('#logout').onclick=$('#logoutMobile').onclick=async()=>{await sb.auth.signOut();user=null;authView()}}
async function createClass(){const grade=$('#grade').value.trim(),branch=$('#branch').value.trim();if(!grade||!branch){toast('Sınıf düzeyi ve şubeyi yaz');return}const{data,error}=await sb.from('classrooms').insert({teacher_id:user.id,grade,branch}).select().single();if(error){toast(errText(error));return}classes.push(data);currentClass=data;await refreshData();renderTeacher('setup')}
async function switchClass(classId){const selected=classes.find(c=>c.id===classId);if(!selected)return;currentClass=selected;studentCredentialReveal=null;await refreshData();renderTeacher('home')}
async function refreshData(){if(!currentClass)return;const s=await sb.from('students').select('id,display_name,username,created_at').eq('classroom_id',currentClass.id).order('display_name');if(s.error)throw s.error;students=s.data||[];const a=await sb.from('assignments').select('*').eq('classroom_id',currentClass.id).order('week_start',{ascending:false}).order('created_at',{ascending:false});if(a.error)throw a.error;assignments=a.data||[];if(assignments.length){const r=await sb.from('responses').select('*').in('assignment_id',assignments.map(x=>x.id));if(r.error)throw r.error;responses=r.data||[]}else responses=[];try{linkCache=JSON.parse(localStorage.getItem('odevPusulasiLinks:'+user.id+':'+currentClass.id)||'{}')}catch{linkCache={}}}
function renderTeacher(page){activeTeacherPage=page;const content=page==='setup'?setupView():page==='links'?linksView():page==='history'?historyView():homeView();const title=page==='setup'?'Sınıf ve öğrenciler':page==='links'?'Öğrenci bağlantıları':page==='history'?'Geçmiş ödevler':'Sınıfım';app.innerHTML=baseShell(content,title);bindLanguageButton(()=>renderTeacher(activeTeacherPage));if($('#classSwitcher'))$('#classSwitcher').onchange=e=>switchClass(e.target.value);if($('#addClassButton'))$('#addClassButton').onclick=showNewClassForm;$$('[data-nav]').forEach(b=>b.onclick=()=>renderTeacher(b.dataset.nav));$('#logout').onclick=$('#logoutMobile').onclick=async()=>{if(poller)clearInterval(poller);await sb.auth.signOut();user=null;authView()};if(page==='home'){ $('#refresh').onclick=async()=>{try{await refreshData();renderTeacher('home');toast('Yanıtlar yenilendi')}catch(e){toast(errText(e))}};$('#addAssignment').onclick=addAssignment;$$('[data-close-assignment]').forEach(b=>b.onclick=()=>closeAssignment(b.dataset.closeAssignment))}if(page==='history')$$('[data-close-assignment]').forEach(b=>b.onclick=()=>closeAssignment(b.dataset.closeAssignment));if(page==='home'||page==='history')$$('[data-teacher-status]').forEach(x=>x.onchange=()=>{if(x.value)setTeacherStatus(x.dataset.assignment,x.dataset.student,x.value,page)});if(page==='setup'){ $('#saveClass').onclick=saveClass;$('#addStudents').onclick=addStudents;$$('[data-credentials]').forEach(b=>b.onclick=()=>openCredentialEditor(b.dataset.credentials));$$('[data-delete-student]').forEach(b=>b.onclick=()=>deleteStudent(b.dataset.deleteStudent));if($('#copyStudentCredentials'))$('#copyStudentCredentials').onclick=async()=>{try{await navigator.clipboard.writeText('Kullanıcı adı: '+studentCredentialReveal.username+'\nŞifre: '+studentCredentialReveal.password);toast('Giriş bilgileri kopyalandı')}catch{toast('Bilgiler ekranda görünüyor; buradan kopyalayabilirsin')}};if($('#hideStudentCredentials'))$('#hideStudentCredentials').onclick=()=>{studentCredentialReveal=null;renderTeacher('setup')}}if(page==='links'){ $$('[data-new-link]').forEach(b=>b.onclick=()=>makeLink(b.dataset.newLink));$$('[data-copy-link]').forEach(b=>b.onclick=()=>copyLink(b.dataset.copyLink))}}
async function studentLogout(token){try{await sb.rpc('student_logout',{p_token:token})}catch{}try{sessionStorage.removeItem('odevPusulasiStudentSession')}catch{}const u=new URL(location.href);u.searchParams.delete('o');u.hash='';history.replaceState({},'',u.pathname+u.search+u.hash);authView('student')}
async function saveClass(){const grade=$('#editGrade').value.trim(),branch=$('#editBranch').value.trim();if(!grade||!branch){toast('İki alan da gerekli');return}const{error}=await sb.from('classrooms').update({grade,branch}).eq('id',currentClass.id);if(error){toast(errText(error));return}currentClass={...currentClass,grade,branch};toast('Sınıf güncellendi');renderTeacher('setup')}
async function addStudents(){const names=$('#bulkNames').value.split(/[\n,;]/).map(n=>n.trim()).filter(Boolean);if(!names.length){toast('En az bir öğrenci adı gir');return}const rows=names.map(display_name=>({classroom_id:currentClass.id,display_name}));const{error}=await sb.from('students').insert(rows);if(error){toast(errText(error));return}await refreshData();renderTeacher('setup');toast(`${names.length} öğrenci eklendi`)}
async function deleteStudent(id){if(!confirm('Bu öğrenciyi ve ona ait yanıtları sınıf listesinden kaldırmak istiyor musun?'))return;const{error}=await sb.from('students').delete().eq('id',id);if(error){toast(errText(error));return}await refreshData();renderTeacher('setup')}
async function addAssignment(){const title=$('#aTitle').value.trim(),week=$('#aWeek').value;if(!title||!week){toast('Ödev adı ve hafta başlangıcı gerekli');return}const{error}=await sb.from('assignments').insert({classroom_id:currentClass.id,title,description:$('#aDesc').value.trim(),week_start:week,due_date:$('#aDue').value||null});if(error){toast(errText(error));return}await refreshData();renderTeacher('home');toast('Ödev öğrencilere açıldı')}
async function closeAssignment(id){const{error}=await sb.from('assignments').update({is_open:false}).eq('id',id);if(error){toast(errText(error));return}await refreshData();renderTeacher('home');toast('Ödev kapatıldı')}
async function setTeacherStatus(assignmentId,studentId,status,page){const{error}=await sb.rpc('teacher_set_response_status',{p_assignment_id:assignmentId,p_student_id:studentId,p_status:status});if(error){toast(errText(error));return}await refreshData();renderTeacher(page);toast('Öğrenci durumu kaydedildi')}
async function makeLink(studentId){const{data,error}=await sb.rpc('create_student_access_link',{p_student_id:studentId});if(error){toast(errText(error));return}const u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('o',data);linkCache[studentId]=u.href;localStorage.setItem('odevPusulasiLinks:'+user.id+':'+currentClass.id,JSON.stringify(linkCache));renderTeacher('links');await copyLink(studentId);toast('Bağlantı oluşturuldu ve kopyalandı')}
async function copyLink(studentId){const val=linkCache[studentId];if(!val)return;try{await navigator.clipboard.writeText(val);toast('Öğrenci bağlantısı kopyalandı')}catch{const inp=$(`#link-${CSS.escape(studentId)}`);if(inp){inp.focus();inp.select();document.execCommand('copy');toast('Bağlantı kopyalandı')}}}
async function startTeacher(){const{data:{user:u}}=await sb.auth.getUser();if(!u){authView();return}user=u;try{await loadTeacherData();if(poller)clearInterval(poller);poller=setInterval(async()=>{if(!user||!currentClass)return;try{await refreshData();const active=document.querySelector('[data-nav="home"].active');if(active)renderTeacher('home')}catch{}},25000)}catch(e){app.innerHTML=`<div class="center">${notice(esc(errText(e)),'error')}<button class="btn" id="retry">Tekrar dene</button></div>`;$('#retry').onclick=startTeacher}}
async function startAdmin(){const{data:{user:u}}=await sb.auth.getUser();if(!u){authView('admin');return}user=u;adminMode=true;try{await loadAdminData();renderAdmin();if(adminPoller)clearInterval(adminPoller);adminPoller=setInterval(async()=>{try{const{data:valid}=await sb.rpc('has_admin_access');if(valid!==true){await adminLogout();return}const selected=$('#adminClassSelect')?.value||'';await loadAdminData();renderAdmin(selected)}catch{}},30000)}catch(e){app.innerHTML=`<div class="center"><div class="panel">${notice('Yönetici verileri yüklenemedi: '+esc(errText(e)),'error')}<button class="btn" id="adminRetry">Tekrar dene</button> <button class="btn" id="adminExit">Çıkış yap</button></div></div>`;$('#adminRetry').onclick=startAdmin;$('#adminExit').onclick=adminLogout}}
async function loadAdminData(){const specs=[['teacher_profiles','user_id,display_name,created_at'],['classrooms','id,teacher_id,grade,branch,created_at'],['students','id,classroom_id,display_name,created_at'],['assignments','id,classroom_id,title,description,week_start,due_date,is_open,created_at'],['responses','id,assignment_id,student_id,status,comment,word_one,word_two,reflection,updated_at']];const results=await Promise.all(specs.map(([table,columns])=>sb.from(table).select(columns)));for(const r of results)if(r.error)throw r.error;window.adminData={profiles:results[0].data||[],classes:results[1].data||[],students:results[2].data||[],assignments:results[3].data||[],responses:results[4].data||[]}}
function renderAdmin(selectedClassId=''){activeAdminClass=selectedClassId;const d=window.adminData||{profiles:[],classes:[],students:[],assignments:[],responses:[]},profile=(id)=>d.profiles.find(x=>x.user_id===id),status=(s)=>s?statusName[s]||s:'Henüz yanıt vermedi',sorted=[...d.classes].sort((a,b)=>(a.grade+'-'+a.branch).localeCompare(b.grade+'-'+b.branch,'tr',{numeric:true})),selected=sorted.find(c=>c.id===selectedClassId)||sorted[0],teacher=selected?profile(selected.teacher_id):null,ss=selected?d.students.filter(s=>s.classroom_id===selected.id):[],aa=selected?d.assignments.filter(a=>a.classroom_id===selected.id).sort((a,b)=>b.week_start.localeCompare(a.week_start)):[],rows=aa.length?aa.map(a=>`<article class="assignment"><h3>${esc(a.title)} ${a.is_open?'<span class="badge done">Açık</span>':'<span class="badge wait">Kapalı</span>'}</h3><p>${esc(a.description||'')}</p><div class="meta">Hafta: ${fmt(a.week_start)}${a.due_date?' · Son tarih: '+fmt(a.due_date):''}</div>${ss.map(s=>{const r=d.responses.find(x=>x.assignment_id===a.id&&x.student_id===s.id);return `<div class="answerrow"><div><b>${esc(s.display_name)}</b>${r?.word_one||r?.word_two?`<small>Yeni kelimeler: ${esc([r.word_one,r.word_two].filter(Boolean).join(' · '))}</small>`:''}${r?.reflection?`<small>Yorum: ${esc(r.reflection)}</small>`:''}${r?.comment?`<small>Anlamadığı yer: ${esc(r.comment)}</small>`:''}${r?`<small>Güncellendi: ${new Date(r.updated_at).toLocaleString(language==='en'?'en-US':'tr-TR')}</small>`:''}</div><span class="badge ${r?.status||'wait'}">${tx(status(r?.status))}</span></div>`}).join('')}</article>`).join(''):'<div class="empty">Bu sınıfta henüz ödev yok.</div>',classLabel=selected?`${selected.grade}-${selected.branch}`:'';app.innerHTML=`<div class="center" style="max-width:1250px;margin:0 auto;padding:24px"><header class="top"><div><div class="eyebrow">English Time Ödev Takip Sistemi · Yönetici</div><h1>Tüm sınıflar</h1></div><div class="formrow">${langButton()}<button class="btn" id="adminRefresh">↻ Yenile</button><button class="btn" id="adminLogout">Çıkış yap</button></div></header><div class="gridstats"><div class="stat"><small>Öğretmen</small><b>${d.profiles.length}</b></div><div class="stat"><small>Sınıf / şube</small><b>${d.classes.length}</b></div><div class="stat"><small>Öğrenci</small><b>${d.students.length}</b></div><div class="stat"><small>Ödev yanıtı</small><b>${d.responses.length}</b></div></div>${notice('Listeden bir sınıf seç. Yeni sınıflar otomatik olarak listede görünür.')}<div class="panel"><div class="field"><label for="adminClassSelect">Sınıf seç</label><select id="adminClassSelect">${sorted.map(c=>{const t=profile(c.teacher_id);return `<option value="${c.id}" ${c.id===selected?.id?'selected':''}>${esc(c.grade+'-'+c.branch)} · ${esc(t?.display_name||'Öğretmen adı yok')}</option>`}).join('')}</select></div></div>${selected?`<section class="panel"><div class="panelhead"><div><h2>${esc(classLabel)} · ${esc(teacher?.display_name||'Öğretmen adı yok')}</h2><div class="muted">${esc(teacher?.display_name||'')} · ${esc(selected.teacher_id)}</div></div><span class="badge">${ss.length} öğrenci · ${aa.length} ödev</span></div>${rows}</section>`:'<div class="empty">Henüz sınıf eklenmemiş.</div>'}</div>`;$('#adminClassSelect').onchange=e=>renderAdmin(e.target.value);$('#adminRefresh').onclick=async()=>{const chosen=$('#adminClassSelect').value;try{await loadAdminData();renderAdmin(chosen);toast('Sınıf listesi güncellendi')}catch(e){toast(errText(e))}};$('#adminLogout').onclick=adminLogout}
async function adminLogout(){if(adminPoller)clearInterval(adminPoller);try{await sb.rpc('revoke_admin_access')}catch{}adminMode=false;window.adminData=null;await sb.auth.signOut();user=null;authView('admin')}
function passwordRecoveryView(){app.innerHTML=`<div class="center"><div style="display:flex;justify-content:flex-end">${langButton()}</div><div class="panel"><h1>${tx('Yeni şifre belirle')}</h1><p class="muted">Öğretmen hesabın için en az 8 karakterli yeni bir şifre oluştur.</p><div id="recoveryMsg"></div><div class="fields"><div class="field full"><label for="newTeacherPassword">Yeni şifre</label><input id="newTeacherPassword" type="password" minlength="8" autocomplete="new-password"></div><div class="field full"><button class="btn primary" id="saveTeacherPassword">Şifreyi kaydet</button></div></div></div></div>';$('#saveTeacherPassword').onclick=async()=>{const password=$('#newTeacherPassword').value;if(password.length<8){$('#recoveryMsg').innerHTML=notice('Şifre en az 8 karakter olmalı.','warn');return}const button=$('#saveTeacherPassword');button.disabled=true;try{const{error}=await sb.auth.updateUser({password});if(error)throw error;$('#recoveryMsg').innerHTML=notice('Şifren güncellendi. Hesabın açılıyor.');setTimeout(startTeacher,700)}catch(e){$('#recoveryMsg').innerHTML=notice(esc(errText(e)),'error');button.disabled=false}}}
function showConfigError(){app.innerHTML=`<div class="center"><div class="panel"><div class="brand"><div class="logo">✓</div><div><b>English Time Ödev Takip Sistemi</b><small>Başlatma sırasında bağlantı kurulamadı</small></div></div><div class="message error">Supabase bağlantı bilgileri ayarlı değil veya Supabase'e ulaşılamadı. config.js içindeki Project URL ve publishable key değerlerini kontrol et.</div><button class="btn" onclick="location.reload()">Yeniden yükle</button></div></div>`}
async function studentPage(token){activeStudentToken=token;document.body.className='';app.innerHTML=`<main class="student-shell"><div class="student-brand" style="justify-content:space-between"><div style="display:flex;align-items:center;gap:9px"><div class="logo">✓</div><b>English Time Ödev Takip Sistemi</b></div><div class="formrow">${langButton()}<button class="btn small" id="studentLogout">Çıkış yap</button></div></div><div class="studenthero"><h1>Ödev durumun</h1><p>Durumunu seç, iki yeni kelimeyi ve ödevle ilgili yorumunu yazıp kaydet.</p></div><div id="studentContent" class="panel"><div class="muted">Ödevlerin yükleniyor…</div></div></main>`;const host=$('#studentContent');$('#studentLogout').onclick=()=>studentLogout(token);try{const{data,error}=await sb.rpc('get_student_portal',{p_token:token});if(error)throw error;const payload=data,homeworks=payload.assignments||[];host.innerHTML=`<div style="font-size:12px;font-weight:750;margin-bottom:12px">${esc(payload.student.name)} · ${esc(payload.classroom.grade)}-${esc(payload.classroom.branch)}</div>${homeworks.length?homeworks.map(a=>studentTask(a)).join(''):'<div class="empty">Şu anda açık ödevin yok.</div>'}`;$$('[data-pick]').forEach(b=>b.onclick=()=>{const card=b.closest('[data-task]');card.dataset.selected=b.dataset.status;card.querySelectorAll('[data-pick]').forEach(x=>x.className='choice '+(x===b?'sel '+x.dataset.status:''));card.querySelector('[data-submit]').disabled=false});$$('[data-submit]').forEach(b=>b.onclick=()=>{const card=b.closest('[data-task]');submitAnswer(token,card.dataset.task,card.dataset.selected,card.querySelector('[data-word-one]').value,card.querySelector('[data-word-two]').value,card.querySelector('[data-reflection]').value,card.querySelector('[data-confusion]').value,b)})}catch(e){host.innerHTML=notice(`Bu öğrenci bağlantısı geçersiz veya yenilenmiş olabilir. Öğretmeninden güncel bağlantıyı iste.<br><br>${esc(errText(e))}`,'error')}}
function studentTask(a){const status=a.response_status,opts=[['done','✓ Yaptım'],['no','× Yapmadım'],['partial','◐ Kısmen yaptım'],['confused','? Yardım istiyorum']];return `<article class="task" data-task="${a.id}" data-selected="${status||''}"><h2>${esc(a.title)}</h2><p>${esc(a.description||'')}${a.due_date?' · Son tarih: '+fmt(a.due_date):''}</p><div class="choices">${opts.map(([k,t])=>`<button type="button" class="choice ${status===k?'sel '+k:''}" data-pick="${a.id}" data-status="${k}">${t}</button>`).join('')}</div><div class="fields" style="margin-top:12px"><div class="field"><label>Yeni kelime 1 *</label><input data-word-one maxlength="80" value="${esc(a.word_one||'')}" placeholder="Öğrendiğin kelime"></div><div class="field"><label>Yeni kelime 2 *</label><input data-word-two maxlength="80" value="${esc(a.word_two||'')}" placeholder="Öğrendiğin başka bir kelime"></div><div class="field full"><label>Ödev/konu hakkında yorumun *</label><textarea class="comment" data-reflection maxlength="1000" placeholder="Bu ödevde ne öğrendin? Konu hakkında ne düşünüyorsun?">${esc(a.reflection||'')}</textarea></div><div class="field full"><label>Anlamadığın yer (isteğe bağlı)</label><textarea class="comment" data-confusion maxlength="1000" placeholder="Yardım istiyorsan hangi bölümde zorlandığını yaz">${esc(a.comment||'')}</textarea></div><div class="field full"><button type="button" class="btn primary" data-submit="${a.id}" ${status?'':'disabled'}>Yanıtı kaydet</button></div></div>${status?'<div class="muted" style="margin-top:8px">Yanıtını güncellemek istersen alanları düzenleyip yeniden kaydedebilirsin.</div>':'<div class="muted" style="margin-top:8px">Önce yukarıdan ödev durumunu seç.</div>'}</article>`}
async function submitAnswer(token,assignmentId,status,wordOne,wordTwo,reflection,comment,button){if(!status){toast('Önce ödev durumunu seç.');return}if(!wordOne.trim()||!wordTwo.trim()||!reflection.trim()){toast('İki yeni kelimeyi ve konu yorumunu doldur.');return}button.disabled=true;const{error}=await sb.rpc('submit_student_response',{p_token:token,p_assignment_id:assignmentId,p_status:status,p_word_one:wordOne.trim(),p_word_two:wordTwo.trim(),p_reflection:reflection.trim(),p_comment:comment.trim()});if(error){toast(errText(error));button.disabled=false;return}toast('Yanıtın öğretmenine iletildi');await studentPage(token)}
async function init(){document.documentElement.lang=language;document.title=tx('English Time Ödev Takip Sistemi');if(!configured){configView();return}try{sb=createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const token=new URLSearchParams(location.search).get('o');if(token){await studentPage(token);return}const studentToken=sessionStorage.getItem('odevPusulasiStudentSession');if(studentToken){await studentPage(studentToken);return}const{data:{session}}=await sb.auth.getSession();if(location.hash.includes('type=recovery'))passwordRecoveryView();else if(session){const{data:isAdmin}=await sb.rpc('has_admin_access');if(isAdmin===true){adminMode=true;await startAdmin()}else await startTeacher()}else authView('teacher');sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'){passwordRecoveryView();return}if(event==='SIGNED_IN'&&session){if(location.hash.includes('type=recovery')){passwordRecoveryView();return}user=session.user;setTimeout(async()=>{if(adminMode||adminLoginPending)return;const{data:isAdmin}=await sb.rpc('has_admin_access');if(isAdmin===true){adminMode=true;startAdmin()}else startTeacher()},0)}if(event==='SIGNED_OUT'){user=null;adminMode=false;window.adminData=null;authView('teacher')}})}catch(e){showConfigError()}}
init();
</script></body></html>
