<style>

ackground:#fff;color:#53596e;border-radius:9px;padding:9px 12px;font-weight:650}.btn.primary{background:var(--purple);border-color:var(--purple);color:white}.btn.soft{background:var(--plight);border-color:#e1deff;color:var(--purple)}.btn.danger{color:var(--red);background:var(--rlight);border-color:#f2d7d9}.btn.small{padding:6px 9px;font-size:11px}.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:17px;margin-bottom:14px}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.panelhead h2,.panelhead h3{font-size:14px;margin:0}.gridstats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:15px}.stat{background:white;border:1px solid var(--line);border-radius:12px;padding:13px}.stat small{font-size:10px;color:var(--muted)}.stat b{display:block;font-size:21px;margin-top:4px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:700;color:#596075}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:white;outline-color:#bbb5ff}.field textarea{min-height:68px;resize:vertical}.formrow{display:flex;gap:8px;align-items:center}.formrow input{flex:1}.chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.chip{background:#f1f2f6;border-radius:20px;padding:5px 9px;display:flex;gap:7px;align-items:center;font-size:11px}.chip button{border:0;background:none;color:#9ba0ad;font-weight:800}.assignment{border:1px solid var(--line);border-radius:10px;padding:13px;margin-top:9px}.assignmenthead{display:flex;justify-content:space-between;gap:10px}.assignment h3{font-size:13px;margin:0}.assignment p{font-size:11px;color:#70768a;margin:5px 0}.meta{font-size:10px;color:var(--muted);margin-top:7px}.countrow{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0}.badge{border-radius:20px;padding:5px 8px;font-size:10px;font-weight:750;white-space:nowrap}.badge.done{background:var(--glight);color:var(--green)}.badge.no,.badge.wait{background:#f0f1f5;color:#72788b}.badge.partial{background:var(--alight);color:var(--amber)}.badge.confused{background:var(--rlight);color:var(--red)}.answerrow{padding:8px 9px;background:#fbfbfd;border:1px solid #f0f1f5;border-radius:8px;margin-top:6px;display:grid;grid-template-columns:1fr auto;gap:7px;align-items:center}.answerrow b{font-size:11px}.answerrow small{display:block;font-size:10px;color:#777d90;margin-top:3px}.studentrow{border-top:1px solid #f0f1f5;padding:9px 0;display:flex;justify-content:space-between;gap:8px;align-items:center}.studentrow:first-child{border-top:0}.studentname{font-weight:650;font-size:12px}.linkout{display:flex;gap:6px}.linkout input{min-width:0;width:min(460px,55vw);border:1px solid var(--line);border-radius:7px;padding:7px;font-size:10px}.message{padding:11px 12px;border-radius:9px;background:#f0efff;color:#544cae;font-size:11px;line-height:1.45;margin:10px 0}.message.warn{background:#fff5e4;color:#76520e}.message.error{background:#fff0f0;color:#9d3741}.hidden{display:none!important}.center{max-width:470px;margin:8vh auto;padding:22px}.center h1{font-size:24px;margin:0 0 7px}.center .brand{margin-bottom:22px}.authswitch{display:flex;gap:7px;margin:14px 0}.authswitch button{flex:1}.empty{padding:25px;text-align:center;background:#fbfbfd;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:12px}.student-shell{min-height:100vh;max-width:740px;margin:auto;padding:24px 15px}.student-brand{display:flex;align-items:center;gap:9px;margin-bottom:17px}.studenthero{background:linear-gradient(110deg,#7065df,#9388ef);color:white;padding:18px;border-radius:13px;margin-bottom:14px}.studenthero h1{font-size:19px;margin:0 0 5px}.studenthero p{margin:0;color:#f0efff;font-size:12px}.task{background:white;border:1px solid var(--line);border-radius:12px;padding:15px;margin:10px 0}.task h2{font-size:14px;margin:0 0 5px}.task p{font-size:11px;color:#72788b;margin:0 0 10px}.choices{display:flex;flex-wrap:wrap;gap:7px}.choice{border:1px solid var(--line);background:white;color:#646a7d;border-radius:8px;padding:8px 9px;font-size:11px;font-weight:700}.choice.sel.done{color:var(--green);background:var(--glight);border-color:#c7ead8}.choice.sel.no,.choice.sel.partial{color:var(--amber);background:var(--alight);border-color:#f2e3bd}.choice.sel.confused{color:var(--red);background:var(--rlight);border-color:#f0d3d5}.comment{width:100%;margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:9px;min-height:65px;font-size:12px}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);padding:10px 15px;border-radius:9px;background:#252a3c;color:white;font-size:12px;opacity:0;transition:.18s;z-index:5}.toast.show{opacity:1}.mobilebar{display:none}
@media(max-width:850px){.shell{grid-template-columns:190px 1fr}.main{padding:22px 18px}.gridstats{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.top{align-items:stretch;flex-direction:column}.top>.formrow{width:100%;flex-wrap:wrap;justify-content:space-between}.top>.formrow select{max-width:42vw}.answerrow{grid-template-columns:1fr}.answerrow>div:last-child{display:flex;align-items:center;flex-wrap:wrap;gap:6px}.teacher-status{max-width:100%}.shell{display:block}.side{display:none}.main{padding:15px 13px 80px}.top h1{font-size:20px}.gridstats{gap:7px}.stat{padding:10px}.stat b{font-size:18px}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.panel{padding:13px}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:2}.mobilebar button{border:0;background:none;font-size:10px;color:#73798b}.mobilebar button.active{color:var(--purple)}.linkout input{width:52vw}.student-shell{padding:16px 12px}}
</style><script src="./config.js"></script></head><body>
<div id="app"></div><div id="toast" class="toast"></div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const cfg=window.ODEV_CONFIG||{};
const configured=cfg.supabaseUrl&&cfg.supabaseAnonKey&&!cfg.supabaseUrl.includes('YOUR_')&&!cfg.supabaseAnonKey.includes('YOUR_');
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const app=document.querySelector('#app'),toastEl=document.querySelector('#toast');let sb=null,user=null,classes=[],currentClass=null,students=[],assignments=[],responses=[],poller=null,linkCache={},studentCredentialReveal=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('tr-TR',{day:'numeric',month:'short',year:'numeric'}):'';
const weekToday=()=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return d.toISOString().slice(0,10)};
const statusName={done:'Yaptı',no:'Yapmadı',partial:'Kısmen yaptı',confused:'Anlamadığı yer var'};
function toast(t){toastEl.textContent=t;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),2200)}
function errText(e){return e?.message||'Bir sorun oluştu. Bilgileri kontrol edip tekrar dene.'}
function baseShell(content,page='Sınıfım'){const classControls=classes.length?`<div class="formrow"><select id="classSwitcher" aria-label="Aktif sınıf">${classes.map(c=>`<option value="${c.id}" ${c.id===currentClass?.id?'selected':''}>${esc(c.grade+'-'+c.branch)}</option>`).join('')}</select><button class="btn small" id="addClassButton">+ Sınıf ekle</button></div>`:'';return `<div class="shell"><aside class="side"><div class="brand"><div class="logo">✓</div><div><b>English Time Ödev Takip Sistemi</b><small>Öğretmen alanı</small></div></div><div><div class="navlabel">ÇALIŞMA ALANI</div><nav class="nav"><button data-nav="home" class="${page==='Sınıfım'?'active':''}">▦ &nbsp; Sınıfım</button><button data-nav="history" class="${page==='Geçmiş ödevler'?'active':''}">▤ &nbsp; Geçmiş ödevler</button><button data-nav="setup" class="${page==='Sınıf ve öğrenciler'?'active':''}">♧ &nbsp; Sınıf ve öğrenciler</button><button data-nav="links" class="${page==='Öğrenci bağlantıları'?'active':''}">↗ &nbsp; Öğrenci bağlantıları</button></nav></div><div class="sidebottom"><div class="classbadge"><small>Aktif sınıf</small><b>${currentClass?esc(currentClass.grade+'-'+currentClass.branch):'Sınıf ekle'}</b></div><div class="profile"><div class="avatar">${esc((user?.user_metadata?.display_name||user?.email||'Ö').slice(0,1).toLocaleUpperCase('tr'))}</div><div><b>${esc(user?.user_metadata?.display_name||'Öğretmen')}</b><small>Öğretmen hesabı</small></div></div></div></aside><main class="main"><header class="top"><div><div class="eyebrow">Öğretmen alanı · Haftalık ödev takibi</div><h1>${page}</h1></div><div class="formrow">${classControls}<button class="btn" id="logout">Oturumu kapat</button></div></header><div id="view">${content}</div></main><nav class="mobilebar"><button data-nav="home">▦ Sınıfım</button><button data-nav="history">▤ Geçmiş</button><button data-nav="setup">♧ Sınıf</button><button data-nav="links">↗ Linkler</button><button id="logoutMobile">Çıkış</button></nav></div>`}
function notice(text,kind=''){return `<div class="message ${kind}">${text}</div>`}
function noClass(){return baseShell(`<div class="panel"><div class="panelhead"><div><h2>Yeni sınıf ekle</h2><div class="muted">Sınıf düzeyini ve şubeyi yazıp oluştur.</div></div></div><div class="fields"><div class="field"><label for="grade">Sınıf düzeyi</label><input id="grade" placeholder="Örn. 5"></div><div class="field"><label for="branch">Şube</label><input id="branch" placeholder="Örn. A"></div><div class="field full"><button class="btn primary" id="createClass">Sınıfı oluştur</button></div></div></div>`,'Yeni sınıf ekle')}
function homeView(){const open=assignments.filter(a=>a.is_open),done=responses.filter(r=>r.status==='done').length,help=responses.filter(r=>r.status==='confused').length,waiting=Math.max(0,open.reduce((n,a)=>n+students.length,0)-responses.filter(r=>open.some(a=>a.id===r.assignment_id)).length);return `<div class="gridstats"><div class="stat"><small>Öğrenciler</small><b>${students.length}</b></div><div class="stat"><small>Açık ödevler</small><b>${open.length}</b></div><div class="stat"><small>Yanıt geldi</small><b>${responses.length}</b></div><div class="stat"><small>Yardım istiyor</small><b>${help}</b></div></div><div class="panel"><div class="panelhead"><div><h2>Bu haftanın ödevleri</h2><div class="muted">Yanıt vermeyen öğrenciler “Henüz yanıt vermedi” olarak görünür.</div></div><button id="refresh" class="btn small">↻ Yenile</button></div>${open.length?open.map(a=>taskCard(a)).join(''):'<div class="empty">Henüz açık ödev yok. Ödev eklemek için “Yeni haftalık ödev” alanını kullan.</div>'}</div><div class="panel"><div class="panelhead"><div><h2>Yeni haftalık ödev</h2><div class="muted">Öğrenciye durum bağlantısı otomatik olarak açılır.</div></div></div><div class="fields"><div class="field full"><label for="aTitle">Ödev adı</label><input id="aTitle" placeholder="Örn. Matematik çalışma kitabı, sayfa 32"></div><div class="field full"><label for="aDesc">Kısa açıklama (isteğe bağlı)</label><textarea id="aDesc" placeholder="Öğrenciye ödevle ilgili kısa not"></textarea></div><div class="field"><label for="aWeek">Hafta başlangıcı</label><input id="aWeek" type="date" value="${weekToday()}"></div><div class="field"><label for="aDue">Son tarih (isteğe bağlı)</label><input id="aDue" type="date"></div><div class="field full"><button class="btn primary" id="addAssignment">Ödevi yayımla</button></div></div></div>${notice(`Toplam tamamlayan: <b>${done}</b> · Henüz yanıt vermeyen: <b>${waiting}</b>. Öğretmen hesabın yalnızca kendi sınıfına erişir.`)}`}
function taskCard(a){let rr=responses.filter(r=>r.assignment_id===a.id),counts={done:0,no:0,partial:0,confused:0,wait:0};rr.forEach(r=>counts[r.status]++);counts.wait=Math.max(0,students.length-rr.length);return `<article class="assignment"><div class="assignmenthead"><div><h3>${esc(a.title)}</h3><p>${esc(a.description||'')}</p><div class="meta">Hafta: ${fmt(a.week_start)}${a.due_date?' · Son tarih: '+fmt(a.due_date):''}</div></div>${a.is_open?`<button class="btn small" data-close-assignment="${a.id}">Ödevi kapat</button>`:'<span class="badge wait">Kapalı</span>'}</div><div class="countrow">${[['done','Yaptı'],['no','Yapmadı'],['partial','Kısmen'],['confused','Yardım istiyor'],['wait','Yanıt yok']].map(([k,t])=>`<span class="badge ${k}">${t}: ${counts[k]}</span>`).join('')}</div>${students.map(s=>{let r=rr.find(x=>x.student_id===s.id);return `<div class="answerrow"><div><b>${esc(s.display_name)}</b>${r?.word_one||r?.word_two?`<small>Yeni kelimeler: ${esc([r.word_one,r.word_two].filter(Boolean).join(' · '))}</small>`:''}${r?.reflection?`<small>Konu yorumu: ${esc(r.reflection)}</small>`:''}${r?.comment?`<small>Anlamadığı yer: ${esc(r.comment)}</small>`:''}${r?`<small>Güncellendi: ${new Date(r.updated_at).toLocaleString('tr-TR')}</small>`:''}</div><div><span class="badge ${r?.status||'wait'}">${r?statusName[r.status]:'Henüz yanıt vermedi'}</span><select class="teacher-status" data-teacher-status data-assignment="${a.id}" data-student="${s.id}" aria-label="${esc(s.display_name)} ödev durumu"><option value="">Öğretmen durum işaretle</option>${[['done','Yaptı'],['no','Yapmadı'],['partial','Kısmen'],['confused','Yardım istiyor']].map(([k,t])=>`<option value="${k}" ${r?.status===k?'selected':''}>${t}</option>`).join('')}</select></div></div>`}).join('')}</article>`}
function historyView(){const closed=assignments.filter(a=>!a.is_open);return `<div class="panel"><div class="panelhead"><div><h2>Kapanmış ödevler</h2><div class="muted">Yanıtlar kayıtlı kalır ve daha sonra görüntülenebilir.</div></div></div>${closed.length?closed.map(taskCard).join(''):'<div class="empty">Henüz kapanmış ödev bulunmuyor.</div>'}</div>`}
function usernameSuggestion(name){
  const base=Array.from(String(name||'ogrenci').toLowerCase().replace(/[ıİ]/g,'i').normalize('NFKD')).filter(ch=>{const n=ch.charCodeAt(0);return n<768||n>879}).join('').replace(/[^a-z0-9]/g,'').slice(0,22)||'ogrenci';
  return (base+String(Math.floor(1000+Math.random()*9000))).slice(0,32)
}
function setupView(){
  const reveal=studentCredentialReveal?'<div class="panel"><div class="panelhead"><div><h2>Öğrenci giriş bilgileri</h2><div class="muted">'+esc(studentCredentialReveal.name)+' için şifre yalnızca bu ekranda gösteriliyor.</div></div></div><div class="fields"><div class="field"><label>Kullanıcı adı</label><input readonly value="'+esc(studentCredentialReveal.username)+'"></div><div class="field"><label>Şifre</label><input readonly value="'+esc(studentCredentialReveal.password)+'"></div><div class="field full"><button class="btn primary" id="copyStudentCredentials">Bilgileri kopyala</button> <button class="btn" id="hideStudentCredentials">Gizle</button></div></div><div class="muted">Bilgileri öğrenciye ulaştır. Şifre veritabanında açık olarak tutulmaz; unutulursa yenisini oluşturabilirsin.</div></div>':'';
  return reveal+'<div class="panel"><div class="panelhead"><div><h2>Sınıf bilgileri</h2><div class="muted">Bu öğretmen hesabının sınıfı: '+esc(currentClass.grade)+'-'+esc(currentClass.branch)+'</div></div></div><div class="fields"><div class="field"><label for="editGrade">Sınıf düzeyi</label><input id="editGrade" value="'+esc(currentClass.grade)+'"></div><div class="field"><label for="editBranch">Şube</label><input id="editBranch" value="'+esc(currentClass.branch)+'"></div><div class="field full"><button class="btn primary" id="saveClass">Sınıf bilgilerini güncelle</button></div></div></div><div class="panel"><div class="panelhead"><div><h2>Öğrenci listesi</h2><div class="muted">Bir satıra bir öğrenci adı yaz. Öğrenci giriş bilgilerini buradan oluşturup paylaşabilirsin.</div></div><span class="badge wait">'+students.length+' öğrenci</span></div><div class="fields"><div class="field full"><label for="bulkNames">Öğrenci adları</label><textarea id="bulkNames" placeholder="Örn.&#10;Elif Demir&#10;Mert Kaya&#10;Zeynep Şahin"></textarea></div><div class="field full"><button class="btn primary" id="addStudents">Öğrencileri ekle</button></div></div><div style="margin-top:12px">'+(students.map(s=>'<div class="studentrow"><div><div class="studentname">'+esc(s.display_name)+'</div><div class="muted">'+(s.username?'Kullanıcı adı: '+esc(s.username):'Henüz öğrenci girişi oluşturulmadı')+'</div></div><div class="formrow"><button class="btn soft small" data-credentials="'+s.id+'">'+(s.username?'Giriş bilgilerini değiştir':'Giriş bilgisi oluştur')+'</button><button class="btn danger small" data-delete-student="'+s.id+'">Listeden kaldır</button></div></div>').join('')||'<div class="empty">Henüz öğrenci eklenmedi.</div>')+'<div id="credentialEditor"></div></div></div>'
}
function makeStudentPassword(name){
  let first=String(name||'ogrenci').trim().split(/\s+/)[0].toLowerCase().replace(/[ıİ]/g,'i').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')||'ogrenci';
  let password=first+'2026';while(password.length<8)password+='1';return password.slice(0,72)
}
async function openCredentialEditor(studentId){
  const s=students.find(x=>x.id===studentId);
  if(!s)return;
  const username=s.username||usernameSuggestion(s.display_name),password=makeStudentPassword(s.display_name);
  const buttons=$$('[data-credentials]');
  buttons.forEach(b=>b.disabled=true);
  try{
    const{data,error}=await sb.rpc('set_student_credentials',{p_student_id:studentId,p_username:username,p_password:password});
    if(error)throw error;
    s.username=data||username;
    studentCredentialReveal={name:s.display_name,username:s.username,password};
    renderTeacher('setup');
    toast('Giriş bilgileri oluşturuldu. Öğrenciye paylaşabilirsin.');
  }catch(e){
    toast('Giriş bilgisi oluşturulamadı: '+errText(e));
    buttons.forEach(b=>b.disabled=false);
  }
}
function linksView(){return `<div class="panel"><div class="panelhead"><div><h2>Öğrenci bağlantıları</h2><div class="muted">Her bağlantı tek bir öğrenciye özeldir. Bağlantıyı kopyalayıp öğrenciye gönder.</div></div></div>${notice('Bağlantıyı yenilersen eski bağlantı çalışmayı durdurur. Kişiye özel linki yalnızca ilgili öğrenciyle paylaş.','warn')}${students.map(s=>{let href=linkCache[s.id]||'';return `<div class="studentrow"><div style="flex:1;min-width:0"><div class="studentname">${esc(s.display_name)}</div>${href?`<div class="linkout"><input readonly value="${esc(href)}" id="link-${s.id}"><button class="btn soft small" data-copy-link="${s.id}">Kopyala</button></div>`:'<div class="muted">Henüz bağlantı oluşturulmadı.</div>'}</div><button class="btn small" data-new-link="${s.id}">${href?'Yeni bağlantı':'Bağlantı oluştur'}</button></div>`}).join('')||'<div class="empty">Önce sınıfına öğrenci ekle.</div>'}</div>`}
function authView(role='teacher'){
  app.innerHTML='<div class="center"><div class="brand"><div class="logo">✓</div><div><b>English Time Ödev Takip Sistemi</b><small>Haftalık ödev takibi</small></div></div><div class="authswitch"><button class="btn primary" id="teacherRoleTab">Öğretmen girişi</button><button class="btn" id="studentRoleTab">Öğrenci girişi</button></div><div class="panel" id="teacherLoginPanel"><h1>Öğretmen girişi</h1><p class="muted">Sınıfını kur, haftalık ödev ekle ve öğrenci yanıtlarını izle.</p><div id="authMsg"></div><div class="authswitch"><button class="btn primary" id="loginTab">Giriş yap</button><button class="btn" id="signupTab">Hesap oluştur</button></div><div class="fields"><div id="nameField" class="field full hidden"><label for="fullName">Adın</label><input id="fullName" autocomplete="name" placeholder="Öğretmen adı"></div><div class="field full"><label for="email">E-posta</label><input id="email" type="email" autocomplete="email"></div><div class="field full"><label for="password">Şifre</label><input id="password" type="password" autocomplete="current-password" minlength="8"></div><div class="field full"><button class="btn primary" id="authSubmit">Giriş yap</button><button class="btn" id="forgotPassword" type="button" style="margin-left:8px">Şifremi unuttum</button></div></div><div class="muted">Öğretmen hesapları birbirinden ayrıdır. Öğrenci listeleri ve yanıtlar diğer öğretmenlere gösterilmez.</div></div><div class="panel hidden" id="studentLoginPanel"><h1>Öğrenci girişi</h1><p class="muted">Öğretmeninin verdiği kullanıcı adı ve şifreyle giriş yap.</p><div id="studentLoginMessage"></div><div class="fields"><div class="field full"><label for="studentLoginUsername">Kullanıcı adı</label><input id="studentLoginUsername" autocomplete="username" autocapitalize="none"></div><div class="field full"><label for="studentLoginPassword">Şifre</label><input id="studentLoginPassword" type="password" autocomplete="current-password"></div><div class="field full"><button class="btn primary" id="studentLoginSubmit">Öğrenci olarak giriş yap</button></div></div><div class="muted">Öğrenci girişi yalnızca kendi sınıfını, açık ödevlerini ve yanıt alanını gösterir.</div></div></div>';
  let mode='login';
  const setRole=r=>{const isStudent=r==='student';$('#teacherLoginPanel').classList.toggle('hidden',isStudent);$('#studentLoginPanel').classList.toggle('hidden',!isStudent);$('#teacherRoleTab').className=isStudent?'btn':'btn primary';$('#studentRoleTab').className=isStudent?'btn primary':'btn';if(isStudent)$('#studentLoginUsername').focus()};
  const setMode=m=>{mode=m;$('#loginTab').className=m==='login'?'btn primary':'btn';$('#signupTab').className=m==='signup'?'btn primary':'btn';$('#nameField').classList.toggle('hidden',m!=='signup');$('#authSubmit').textContent=m==='signup'?'Hesap oluştur':'Giriş yap';$('#password').autocomplete=m==='signup'?'new-password':'current-password';$('#authMsg').innerHTML=''};
  $('#teacherRoleTab').onclick=()=>setRole('teacher');$('#studentRoleTab').onclick=()=>setRole('student');setRole(role);
  $('#loginTab').onclick=()=>setMode('login');$('#signupTab').onclick=()=>setMode('signup');
  $('#forgotPassword').onclick=async()=>{const email=$('#email').value.trim();if(!email){$('#authMsg').innerHTML=notice('Önce öğretmen hesabındaki e-posta adresini yaz.','warn');$('#email').focus();return}const button=$('#forgotPassword');button.disabled=true;try{const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)throw error;$('#authMsg').innerHTML=notice('E-posta adresin kayıtlıysa şifre yenileme bağlantısı gönderildi. Gelen kutunu ve gereksiz posta klasörünü kontrol et.')}catch(e){$('#authMsg').innerHTML=notice(esc(errText(e)),'error')}finally{button.disabled=false}};
  $('#email').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#password').focus()}};$('#password').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#authSubmit').click()}};$('#studentLoginUsername').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#studentLoginPassword').focus()}};$('#studentLoginPassword').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#studentLoginSubmit').click()}};$('#authSubmit').onclick=async()=>{const email=$('#email').value.trim(),password=$('#password').value,name=$('#fullName')?.value.trim();if(!email||password.length<8){$('#authMsg').innerHTML=notice('E-posta gir ve en az 8 karakterli şifre seç.','warn');return}$('#authSubmit').disabled=true;try{if(mode==='signup'){const{data,error}=await sb.auth.signUp({email,password,options:{data:{display_name:name||'Öğretmen'}}});if(error)throw error;if(!data.session){$('#authMsg').innerHTML=notice('Hesap oluşturuldu. E-postana gelen doğrulama bağlantısını aç, sonra giriş yap.');return}}else{const{error}=await sb.auth.signInWithPassword({email,password});if(error)throw error}return}catch(e){$('#authMsg').innerHTML=notice(esc(errText(e)),'error')}finally{$('#authSubmit').disabled=false}};
  $('#studentLoginSubmit').onclick=async()=>{const username=$('#studentLoginUsername').value.trim(),password=$('#studentLoginPassword').value;if(!username||!password){$('#studentLoginMessage').innerHTML=notice('Kullanıcı adı ve şifreyi yaz.','warn');return}const button=$('#studentLoginSubmit');button.disabled=true;try{const{data,error}=await sb.rpc('student_login',{p_username:username,p_password:password});if(error)throw error;if(typeof data!=='string'||data.length<40)throw new Error('Giriş yanıtı alınamadı.');sessionStorage.setItem('odevPusulasiStudentSession',data);const u=new URL(location.href);u.searchParams.delete('o');u.hash='';history.replaceState({},'',u.pathname+u.search+u.hash);await studentPage(data)}catch(e){$('#studentLoginMessage').innerHTML=notice(esc(errText(e)),'error');button.disabled=false}}
}
function configView(){app.innerHTML=`<div class="center"><div class="panel"><div class="brand"><div class="logo">✓</div><div><b>English Time Ödev Takip Sistemi kurulumu</b><small>Bir defalık bağlantı ayarı</small></div></div><p>Bu taslak veri güvenliği için Supabase hesabına bağlanacak şekilde hazırlandı. Önce Supabase projesi oluştur, <b>supabase-schema.sql</b> dosyasını SQL Editor'de çalıştır ve Project URL ile publishable key değerlerini <b>config.js</b> dosyasına gir.</p><p class="muted">Tarayıcıda sadece publishable/anon key kullanılır. Secret veya service_role anahtarını buraya koyma.</p><div class="message warn">Kurulum tamamlanmadan öğretmen hesabı, gerçek öğrenci bağlantısı ve cihazlar arası yanıt eşitlemesi kullanılamaz.</div></div></div>`}
async function loadTeacherData(){const p=await sb.from('teacher_profiles').select('display_name').eq('user_id',user.id).maybeSingle();if(p.error)throw p.error;if(p.data?.display_name&&p.data.display_name!==user.user_metadata?.display_name){await sb.auth.updateUser({data:{display_name:p.data.display_name}})}const c=await sb.from('classrooms').select('*').order('created_at');if(c.error)throw c.error;classes=c.data||[];if(!classes.length){currentClass=null;showNewClassForm();return}currentClass=classes[0];await refreshData();renderTeacher('home')}
function showNewClassForm(){app.innerHTML=noClass();$('#createClass').onclick=createClass;$('#logout').onclick=$('#logoutMobile').onclick=async()=>{await sb.auth.signOut();user=null;authView()}}
async function createClass(){const grade=$('#grade').value.trim(),branch=$('#branch').value.trim();if(!grade||!branch){toast('Sınıf düzeyi ve şubeyi yaz');return}const{data,error}=await sb.from('classrooms').insert({teacher_id:user.id,grade,branch}).select().single();if(error){toast(errText(error));return}classes.push(data);currentClass=data;await refreshData();renderTeacher('setup')}
async function switchClass(classId){const selected=classes.find(c=>c.id===classId);if(!selected)return;currentClass=selected;studentCredentialReveal=null;await refreshData();renderTeacher('home')}
async function refreshData(){if(!currentClass)return;const s=await sb.from('students').select('id,display_name,username,created_at').eq('classroom_id',currentClass.id).order('display_name');if(s.error)throw s.error;students=s.data||[];const a=await sb.from('assignments').select('*').eq('classroom_id',currentClass.id).order('week_start',{ascending:false}).order('created_at',{ascending:false});if(a.error)throw a.error;assignments=a.data||[];if(assignments.length){const r=await sb.from('responses').select('*').in('assignment_id',assignments.map(x=>x.id));if(r.error)throw r.error;responses=r.data||[]}else responses=[];try{linkCache=JSON.parse(localStorage.getItem('odevPusulasiLinks:'+user.id+':'+currentClass.id)||'{}')}catch{linkCache={}}}
function renderTeacher(page){const content=page==='setup'?setupView():page==='links'?linksView():page==='history'?historyView():homeView();const title=page==='setup'?'Sınıf ve öğrenciler':page==='links'?'Öğrenci bağlantıları':page==='history'?'Geçmiş ödevler':'Sınıfım';app.innerHTML=baseShell(content,title);if($('#classSwitcher'))$('#classSwitcher').onchange=e=>switchClass(e.target.value);if($('#addClassButton'))$('#addClassButton').onclick=showNewClassForm;$$('[data-nav]').forEach(b=>b.onclick=()=>renderTeacher(b.dataset.nav));$('#logout').onclick=$('#logoutMobile').onclick=async()=>{if(poller)clearInterval(poller);await sb.auth.signOut();user=null;authView()};if(page==='home'){ $('#refresh').onclick=async()=>{try{await refreshData();renderTeacher('home');toast('Yanıtlar yenilendi')}catch(e){toast(errText(e))}};$('#addAssignment').onclick=addAssignment;$$('[data-close-assignment]').forEach(b=>b.onclick=()=>closeAssignment(b.dataset.closeAssignment))}if(page==='history')$$('[data-close-assignment]').forEach(b=>b.onclick=()=>closeAssignment(b.dataset.closeAssignment));if(page==='home'||page==='history')$$('[data-teacher-status]').forEach(x=>x.onchange=()=>{if(x.value)setTeacherStatus(x.dataset.assignment,x.dataset.student,x.value,page)});if(page==='setup'){ $('#saveClass').onclick=saveClass;$('#addStudents').onclick=addStudents;$$('[data-credentials]').forEach(b=>b.onclick=()=>openCredentialEditor(b.dataset.credentials));$$('[data-delete-student]').forEach(b=>b.onclick=()=>deleteStudent(b.dataset.deleteStudent));if($('#copyStudentCredentials'))$('#copyStudentCredentials').onclick=async()=>{try{await navigator.clipboard.writeText('Kullanıcı adı: '+studentCredentialReveal.username+'\nŞifre: '+studentCredentialReveal.password);toast('Giriş bilgileri kopyalandı')}catch{toast('Bilgiler ekranda görünüyor; buradan kopyalayabilirsin')}};if($('#hideStudentCredentials'))$('#hideStudentCredentials').onclick=()=>{studentCredentialReveal=null;renderTeacher('setup')}}if(page==='links'){ $$('[data-new-link]').forEach(b=>b.onclick=()=>makeLink(b.dataset.newLink));$$('[data-copy-link]').forEach(b=>b.onclick=()=>copyLink(b.dataset.copyLink))}}
async function studentLogout(token){try{await sb.rpc('student_logout',{p_token:token})}catch{}try{sessionStorage.removeItem('odevPusulasiStudentSession')}catch{}const u=new URL(location.href);u.searchParams.delete('o');u.hash='';history.replaceState({},'',u.pathname+u.search+u.hash);authView('student')}
async function saveClass(){const grade=$('#editGrade').value.trim(),branch=$('#editBranch').value.trim();if(!grade||!branch){toast('İki alan da gerekli');return}const{error}=await sb.from('classrooms').update({grade,branch}).eq('id',currentClass.id);if(error){toast(errText(error));return}currentClass={...currentClass,grade,branch};toast('Sınıf güncellendi');renderTeacher('setup')}
async function addStudents(){const names=$('#bulkNames').value.split(/[\n,;]/).map(n=>n.trim()).filter(Boolean);if(!names.length){toast('En az bir öğrenci adı gir');return}const rows=names.map(display_name=>({classroom_id:currentClass.id,display_name}));const{error}=await sb.from('students').insert(rows);if(error){toast(errText(error));return}await refreshData();renderTeacher('setup');toast(`${names.length} öğrenci eklendi`)}
async function deleteStudent(id){if(!confirm('Bu öğrenciyi ve ona ait yanıtları sınıf listesinden kaldırmak istiyor musun?'))return;const{error}=await sb.from('students').delete().eq('id',id);if(error){toast(errText(error));return}await refreshData();renderTeacher('setup')}
async function addAssignment(){const title=$('#aTitle').value.trim(),week=$('#aWeek').value;if(!title||!week){toast('Ödev adı ve hafta başlangıcı gerekli');return}const{error}=await sb.from('assignments').insert({classroom_id:currentClass.id,title,description:$('#aDesc').value.trim(),week_start:week,due_date:$('#aDue').value||null});if(error){toast(errText(error));return}await refreshData();renderTeacher('home');toast('Ödev öğrencilere açıldı')}
async function closeAssignment(id){const{error}=await sb.from('assignments').update({is_open:false}).eq('id',id);if(error){toast(errText(error));return}await refreshData();renderTeacher('home');toast('Ödev kapatıldı')}
async function setTeacherStatus(assignmentId,studentId,status,page){const{error}=await sb.rpc('teacher_set_response_status',{p_assignment_id:assignmentId,p_student_id:studentId,p_status:status});if(error){toast(errText(error));return}await refreshData();renderTeacher(page);toast('Öğrenci durumu kaydedildi')}
async function makeLink(studentId){const{data,error}=await sb.rpc('create_student_access_link',{p_student_id:studentId});if(error){toast(errText(error));return}const u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('o',data);linkCache[studentId]=u.href;localStorage.setItem('odevPusulasiLinks:'+user.id+':'+currentClass.id,JSON.stringify(linkCache));renderTeacher('links');await copyLink(studentId);toast('Bağlantı oluşturuldu ve kopyalandı')}
async function copyLink(studentId){const val=linkCache[studentId];if(!val)return;try{await navigator.clipboard.writeText(val);toast('Öğrenci bağlantısı kopyalandı')}catch{const inp=$(`#link-${CSS.escape(studentId)}`);if(inp){inp.focus();inp.select();document.execCommand('copy');toast('Bağlantı kopyalandı')}}}
async function startTeacher(){const{data:{user:u}}=await sb.auth.getUser();if(!u){authView();return}user=u;try{await loadTeacherData();if(poller)clearInterval(poller);poller=setInterval(async()=>{if(!user||!currentClass)return;try{await refreshData();const active=document.querySelector('[data-nav="home"].active');if(active)renderTeacher('home')}catch{}},25000)}catch(e){app.innerHTML=`<div class="center">${notice(esc(errText(e)),'error')}<button class="btn" id="retry">Tekrar dene</button></div>`;$('#retry').onclick=startTeacher}}
function passwordRecoveryView(){app.innerHTML='<div class="center"><div class="panel"><h1>Yeni şifre belirle</h1><p class="muted">Öğretmen hesabın için en az 8 karakterli yeni bir şifre oluştur.</p><div id="recoveryMsg"></div><div class="fields"><div class="field full"><label for="newTeacherPassword">Yeni şifre</label><input id="newTeacherPassword" type="password" minlength="8" autocomplete="new-password"></div><div class="field full"><button class="btn primary" id="saveTeacherPassword">Şifreyi kaydet</button></div></div></div></div>';$('#saveTeacherPassword').onclick=async()=>{const password=$('#newTeacherPassword').value;if(password.length<8){$('#recoveryMsg').innerHTML=notice('Şifre en az 8 karakter olmalı.','warn');return}const button=$('#saveTeacherPassword');button.disabled=true;try{const{error}=await sb.auth.updateUser({password});if(error)throw error;$('#recoveryMsg').innerHTML=notice('Şifren güncellendi. Hesabın açılıyor.');setTimeout(startTeacher,700)}catch(e){$('#recoveryMsg').innerHTML=notice(esc(errText(e)),'error');button.disabled=false}}}
function showConfigError(){app.innerHTML=`<div class="center"><div class="panel"><div class="brand"><div class="logo">✓</div><div><b>English Time Ödev Takip Sistemi</b><small>Başlatma sırasında bağlantı kurulamadı</small></div></div><div class="message error">Supabase bağlantı bilgileri ayarlı değil veya Supabase'e ulaşılamadı. config.js içindeki Project URL ve publishable key değerlerini kontrol et.</div><button class="btn" onclick="location.reload()">Yeniden yükle</button></div></div>`}
async function studentPage(token){document.body.className='';app.innerHTML=`<main class="student-shell"><div class="student-brand"><div style="display:flex;align-items:center;gap:9px"><div class="logo">✓</div><b>English Time Ödev Takip Sistemi</b></div><button class="btn small" id="studentLogout">Çıkış yap</button></div><div class="studenthero"><h1>Ödev durumun</h1><p>Durumunu seç, iki yeni kelimeyi ve ödevle ilgili yorumunu yazıp kaydet.</p></div><div id="studentContent" class="panel"><div class="muted">Ödevlerin yükleniyor…</div></div></main>`;const host=$('#studentContent');$('#studentLogout').onclick=()=>studentLogout(token);try{const{data,error}=await sb.rpc('get_student_portal',{p_token:token});if(error)throw error;const payload=data,homeworks=payload.assignments||[];host.innerHTML=`<div style="font-size:12px;font-weight:750;margin-bottom:12px">${esc(payload.student.name)} · ${esc(payload.classroom.grade)}-${esc(payload.classroom.branch)}</div>${homeworks.length?homeworks.map(a=>studentTask(a)).join(''):'<div class="empty">Şu anda açık ödevin yok.</div>'}`;$$('[data-pick]').forEach(b=>b.onclick=()=>{const card=b.closest('[data-task]');card.dataset.selected=b.dataset.status;card.querySelectorAll('[data-pick]').forEach(x=>x.className='choice '+(x===b?'sel '+x.dataset.status:''));card.querySelector('[data-submit]').disabled=false});$$('[data-submit]').forEach(b=>b.onclick=()=>{const card=b.closest('[data-task]');submitAnswer(token,card.dataset.task,card.dataset.selected,card.querySelector('[data-word-one]').value,card.querySelector('[data-word-two]').value,card.querySelector('[data-reflection]').value,card.querySelector('[data-confusion]').value,b)})}catch(e){host.innerHTML=notice(`Bu öğrenci bağlantısı geçersiz veya yenilenmiş olabilir. Öğretmeninden güncel bağlantıyı iste.<br><br>${esc(errText(e))}`,'error')}}
function studentTask(a){const status=a.response_status,opts=[['done','✓ Yaptım'],['no','× Yapmadım'],['partial','◐ Kısmen yaptım'],['confused','? Yardım istiyorum']];return `<article class="task" data-task="${a.id}" data-selected="${status||''}"><h2>${esc(a.title)}</h2><p>${esc(a.description||'')}${a.due_date?' · Son tarih: '+fmt(a.due_date):''}</p><div class="choices">${opts.map(([k,t])=>`<button type="button" class="choice ${status===k?'sel '+k:''}" data-pick="${a.id}" data-status="${k}">${t}</button>`).join('')}</div><div class="fields" style="margin-top:12px"><div class="field"><label>Yeni kelime 1 *</label><input data-word-one maxlength="80" value="${esc(a.word_one||'')}" placeholder="Öğrendiğin kelime"></div><div class="field"><label>Yeni kelime 2 *</label><input data-word-two maxlength="80" value="${esc(a.word_two||'')}" placeholder="Öğrendiğin başka bir kelime"></div><div class="field full"><label>Ödev/konu hakkında yorumun *</label><textarea class="comment" data-reflection maxlength="1000" placeholder="Bu ödevde ne öğrendin? Konu hakkında ne düşünüyorsun?">${esc(a.reflection||'')}</textarea></div><div class="field full"><label>Anlamadığın yer (isteğe bağlı)</label><textarea class="comment" data-confusion maxlength="1000" placeholder="Yardım istiyorsan hangi bölümde zorlandığını yaz">${esc(a.comment||'')}</textarea></div><div class="field full"><button type="button" class="btn primary" data-submit="${a.id}" ${status?'':'disabled'}>Yanıtı kaydet</button></div></div>${status?'<div class="muted" style="margin-top:8px">Yanıtını güncellemek istersen alanları düzenleyip yeniden kaydedebilirsin.</div>':'<div class="muted" style="margin-top:8px">Önce yukarıdan ödev durumunu seç.</div>'}</article>`}
async function submitAnswer(token,assignmentId,status,wordOne,wordTwo,reflection,comment,button){if(!status){toast('Önce ödev durumunu seç.');return}if(!wordOne.trim()||!wordTwo.trim()||!reflection.trim()){toast('İki yeni kelimeyi ve konu yorumunu doldur.');return}button.disabled=true;const{error}=await sb.rpc('submit_student_response',{p_token:token,p_assignment_id:assignmentId,p_status:status,p_word_one:wordOne.trim(),p_word_two:wordTwo.trim(),p_reflection:reflection.trim(),p_comment:comment.trim()});if(error){toast(errText(error));button.disabled=false;return}toast('Yanıtın öğretmenine iletildi');await studentPage(token)}
async function init(){if(!configured){configView();return}try{sb=createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const token=new URLSearchParams(location.search).get('o');if(token){await studentPage(token);return}const studentToken=sessionStorage.getItem('odevPusulasiStudentSession');if(studentToken){await studentPage(studentToken);return}const{data:{session}}=await sb.auth.getSession();if(location.hash.includes('type=recovery'))passwordRecoveryView();else if(session)await startTeacher();else authView('teacher');sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'){passwordRecoveryView();return}if(event==='SIGNED_IN'&&session){if(location.hash.includes('type=recovery')){passwordRecoveryView();return}user=session.user;setTimeout(startTeacher,0)}if(event==='SIGNED_OUT'){user=null;authView('teacher')}})}catch(e){showConfigError()}}
init();
</script></body></html>
